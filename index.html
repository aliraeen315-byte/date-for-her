<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question For You ❤️</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body{
        background: linear-gradient(135deg,#ff9a9e,#fad0c4);
        height:100vh;
        overflow:hidden;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .container{
        text-align:center;
        color:white;
        padding:20px;
    }

    h1{
        font-size:3rem;
        margin-bottom:20px;
        animation: fadeIn 1.5s ease;
    }

    p{
        font-size:1.3rem;
        margin-bottom:30px;
    }

    .btn{
        border:none;
        padding:15px 30px;
        margin:10px;
        border-radius:50px;
        font-size:1.1rem;
        cursor:pointer;
        transition:0.3s;
    }

    #yes{
        background:#fff;
        color:#ff4d6d;
        font-weight:bold;
    }

    #yes:hover{
        transform:scale(1.1);
    }

    #no{
        background:#ff4d6d;
        color:white;
        position:relative;
    }

    .hidden{
        display:none;
    }

    #success{
        animation: fadeIn 1s ease;
    }

    #success h2{
        font-size:3rem;
        margin-bottom:15px;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(20px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    .heart{
        position:absolute;
        color:white;
        font-size:24px;
        animation: float 5s linear infinite;
    }

    @keyframes float{
        from{
            transform:translateY(100vh);
            opacity:1;
        }
        to{
            transform:translateY(-100px);
            opacity:0;
        }
    }
</style>
</head>
<body>

<div class="container" id="questionBox">
    <h1>Hey Beautiful ❤️</h1>
    <p>
        Every conversation with you makes my day better.<br><br>
        So I have one important question...
    </p>

    <h2>Will you go on a date with me? 💕</h2>

    <br><br>

    <button class="btn" id="yes">YES ❤️</button>
    <button class="btn" id="no">NO 😅</button>
</div>

<div class="container hidden" id="success">
    <h2>YAY! ❤️🎉</h2>
    <p>
        You just made me the happiest person alive.<br><br>
        Our date is officially confirmed! 💖
    </p>

    <h3>Now let's decide where we're going 😉</h3>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

noBtn.addEventListener("mouseover", () => {
    const x = Math.floor(Math.random() * (window.innerWidth - 100));
    const y = Math.floor(Math.random() * (window.innerHeight - 50));

    noBtn.style.position = "absolute";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

yesBtn.addEventListener("click", () => {
    document.getElementById("questionBox").classList.add("hidden");
    document.getElementById("success").classList.remove("hidden");

    for(let i=0;i<40;i++){
        const heart = document.createElement("div");
        heart.innerHTML = "❤️";
        heart.classList.add("heart");
        heart.style.left = Math.random()*100 + "vw";
        heart.style.animationDuration = (Math.random()*3+2)+"s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        },5000);
    }
});
</script>

</body>
</html>
